# TLS-terminating reverse proxy in front of a plaintext backend — the
# scenario #144 exists for (docker-compose service-to-service TLS). Mounted
# over /etc/nginx/conf.d/default.conf, which both the Debian-based and
# Alpine-based official nginx images include from their base nginx.conf.
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location / {
        proxy_pass http://backend:80/;
        proxy_set_header Host $host;
    }
}
