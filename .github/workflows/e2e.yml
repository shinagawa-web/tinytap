name: e2e

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: ${{ matrix.checkName }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - checkName: e2e
            script: scripts/test-e2e.sh
          - checkName: e2e-tls-nginx
            script: scripts/test-e2e-tls-nginx.sh
          - checkName: e2e-tls-node
            script: scripts/test-e2e-tls-node.sh
            needs_node: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up BPF toolchain and regenerate bindings
        uses: ./.github/actions/setup-bpf-toolchain

      - name: Install Node.js (NodeSource — statically links OpenSSL, unstripped)
        if: matrix.needs_node
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs

      - name: Run e2e tests
        run: bash ${{ matrix.script }}
