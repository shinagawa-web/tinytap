name: diag-440

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

jobs:
  diag:
    name: diag-440 (${{ matrix.shard }})
    runs-on: ubuntu-26.04
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Show runner
        run: |
          uname -r
          nproc

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up BPF toolchain and regenerate bindings
        uses: ./.github/actions/setup-bpf-toolchain

      - name: Install bpftool
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-tools-$(uname -r)" linux-tools-common || sudo apt-get install -y bpftool || true
          sudo bpftool version || true
          sudo apt-get install -y bpftrace || true
          bpftrace --version || true

      - name: Build test binary
        run: go test -c -tags=privileged -o "${RUNNER_TEMP}/cmd.test" ./cmd/tinytap

      - name: Run diagnostics
        run: bash scripts/diag-440.sh "${RUNNER_TEMP}/cmd.test"
