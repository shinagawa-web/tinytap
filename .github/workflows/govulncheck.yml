name: govulncheck

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # The pinned govulncheck (see Makefile) requires a newer Go than go.mod's own minimum
      # (go.mod: 1.24.0). Provisioned separately here rather than bumping
      # go.mod for the whole module just to satisfy this check — and
      # deliberately not go.mod's own version, since an older govulncheck
      # compatible with go.mod's Go doesn't scope vulnerability reachability
      # by target platform as precisely (confirmed locally: v1.1.4 flags a
      # Windows-only stdlib CVE, GO-2025-3750, as reachable on this
      # Linux-only eBPF tool; the latest govulncheck correctly excludes it).
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25"
          cache: true

      - name: Run govulncheck
        run: make govulncheck
