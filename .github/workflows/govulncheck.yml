name: govulncheck

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # The pinned govulncheck (see Makefile) needs a Go new enough to scope
      # vulnerability reachability by target platform precisely (confirmed
      # locally: v1.1.4 flags a Windows-only stdlib CVE, GO-2025-3750, as
      # reachable on this Linux-only eBPF tool; the latest govulncheck
      # correctly excludes it). go.mod's own minimum now satisfies that.
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up BPF toolchain and regenerate bindings
        uses: ./.github/actions/setup-bpf-toolchain

      - name: Run govulncheck
        run: make govulncheck
