name: style-check

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "site/content/**"
      - "scripts/check-style.sh"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "site/content/**"
      - "scripts/check-style.sh"

jobs:
  check-style:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check docs style
        run: bash scripts/check-style.sh
