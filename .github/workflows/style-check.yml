name: style-check

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "site/content/**"
      - "scripts/check-style.sh"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "site/content/**"
      - "scripts/check-style.sh"

jobs:
  check-style:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check docs style
        run: bash scripts/check-style.sh
