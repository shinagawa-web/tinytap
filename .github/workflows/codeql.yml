name: CodeQL

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up BPF toolchain and regenerate bindings
        uses: ./.github/actions/setup-bpf-toolchain

      # build-mode: manual + an explicit `go build` below, instead of
      # autobuild. Autobuild runs `make` when it finds a Makefile, and this
      # repo's default `make` target depends on bpf2go (clang-17) — already
      # installed above by setup-bpf-toolchain, but autobuild's own
      # unconfigured `make` invocation would also re-run `go generate`
      # redundantly and isn't worth relying on; an explicit `go build`
      # below is simpler and CodeQL still extracts tinytap's own code from
      # it (autobuild falling back to only stdlib packages was the
      # original problem this build-mode avoids).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: go
          build-mode: manual

      - name: Build
        run: go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/language:go"
