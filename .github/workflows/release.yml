name: release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"

jobs:
  goreleaser:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    permissions:
      contents: write
      # id-token is what lets cosign mint a keyless signature from this
      # workflow's own OIDC identity (no key material stored anywhere);
      # attestations is what lets actions/attest-build-provenance publish
      # its SLSA statement to the repo's attestation store.
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          # GoReleaser needs the full history (and tags) to build the
          # changelog between the previous tag and this one.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          # Caching disabled (unlike the other workflows): this job
          # publishes release artifacts, so a poisoned build cache is a
          # supply-chain risk here in a way it isn't for a plain CI run.
          cache: false

      # GoReleaser shells out to both of these (sboms: / signs: in
      # .goreleaser.yml) rather than linking them in, so they need to be on
      # PATH before the release step runs.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA provenance for the actual binaries — separate from cosign's
      # checksums.txt signature above, which proves "these bytes are what
      # tinytap published" but not "here's the source commit and workflow
      # that built them". subject-path only globs the archives, not
      # checksums.txt/SBOMs/signature files, since provenance is about the
      # build inputs/outputs, not the metadata generated to describe them.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*.tar.gz"

      # Feeds the provenance job below (in-toto/SLSA3, via slsa-github-generator).
      # This is a second, distinct provenance mechanism from actions/attest-build-provenance
      # above: that one publishes to GitHub's own attestation store (verifiable via `gh
      # attestation verify`, not a release asset); this one attaches a downloadable
      # `.intoto.jsonl` file directly to the GitHub Release, which is the format
      # OpenSSF Scorecard's Signed-Releases check looks for on release assets.
      - name: Generate artifact hashes
        id: hash
        run: |
          files=(dist/*checksums.txt)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "Expected exactly one checksums file, found: ${files[*]}" >&2
            exit 1
          fi
          hashes=$(base64 -w0 < "${files[0]}")
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"

  # Generates SLSA Build L3 provenance for the checksummed release artifacts and
  # attaches it to the GitHub Release as a `.intoto.jsonl` asset. Pinned by commit SHA
  # (not tag) to match this repo's dependency-pinning convention — which requires
  # compile-generator: true below, because slsa-github-generator's default
  # download-a-prebuilt-binary path only accepts a `refs/tags/vX.Y.Z`-shaped BUILDER_REF
  # and errors on a bare commit SHA; compiling from source instead sidesteps that
  # restriction. (Diagnosed upstream: slsa-framework/slsa-github-generator#4503.)
  provenance:
    needs: goreleaser
    permissions:
      actions: read # to read the calling workflow's path
      id-token: write # to sign the provenance
      contents: write # to add the provenance asset to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.goreleaser.outputs.hashes }}"
      upload-assets: true
      compile-generator: true
