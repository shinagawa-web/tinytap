name: release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"

jobs:
  goreleaser:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      # id-token is what lets cosign mint a keyless signature from this
      # workflow's own OIDC identity (no key material stored anywhere);
      # attestations is what lets actions/attest-build-provenance publish
      # its SLSA statement to the repo's attestation store.
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          # GoReleaser needs the full history (and tags) to build the
          # changelog between the previous tag and this one.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          # Caching disabled (unlike the other workflows): this job
          # publishes release artifacts, so a poisoned build cache is a
          # supply-chain risk here in a way it isn't for a plain CI run.
          cache: false

      # GoReleaser shells out to both of these (sboms: / signs: in
      # .goreleaser.yml) rather than linking them in, so they need to be on
      # PATH before the release step runs.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA provenance for the actual binaries — separate from cosign's
      # checksums.txt signature above, which proves "these bytes are what
      # tinytap published" but not "here's the source commit and workflow
      # that built them". subject-path only globs the archives, not
      # checksums.txt/SBOMs/signature files, since provenance is about the
      # build inputs/outputs, not the metadata generated to describe them.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*.tar.gz"
