name: integration

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    # Stay on 22.04 until Ubuntu ships a fix for #440: the 7.0 kernels on the
    # 24.04 and 26.04 images only run sys_enter_write BPF programs on CPU 0.
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up BPF toolchain and regenerate bindings
        uses: $/.github/actions/setup-bpf-toolchain

      - name: Run integration tests
        run: make test-integration
