name: soak

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duration in seconds'
        default: '900'
        type: string

jobs:
  soak:
    name: soak / ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: churn
            sleep_between_reqs: '0.1'

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up BPF toolchain and regenerate bindings
        uses: ./.github/actions/setup-bpf-toolchain

      - name: Install bpftool
        run: sudo apt-get install -y linux-tools-common linux-tools-$(uname -r)

      - name: Run soak
        env:
          DURATION: ${{ inputs.duration }}
          SLEEP_BETWEEN_REQS: ${{ matrix.sleep_between_reqs }}
          TSV_OUT: /tmp/soak-${{ matrix.name }}.tsv
        run: bash scripts/soak.sh

      - name: Upload TSV
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-tsv-${{ matrix.name }}
          path: /tmp/soak-${{ matrix.name }}.tsv
