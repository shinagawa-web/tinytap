name: soak

permissions:
  contents: read

on:
  push:
    branches: [worktree-issue-321-soak-ci]
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duration in seconds'
        default: '900'
        type: string

jobs:
  soak:
    name: soak / ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: churn
            sleep_between_reqs: '0.1'

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up BPF toolchain and regenerate bindings
        uses: ./.github/actions/setup-bpf-toolchain

      - name: Install bpftool
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common "linux-tools-$(uname -r)"

      - name: Run soak
        env:
          DURATION: ${{ inputs.duration || '60' }}
          SLEEP_BETWEEN_REQS: ${{ matrix.sleep_between_reqs }}
          TSV_OUT: /tmp/soak-${{ matrix.name }}.tsv
          MD_OUT: /tmp/soak-${{ matrix.name }}.md
          BPF2GO_CC: clang-17
        run: |
          : > /tmp/soak-${{ matrix.name }}.tsv
          : > /tmp/soak-${{ matrix.name }}.md
          bash scripts/soak.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-${{ matrix.name }}
          path: |
            /tmp/soak-${{ matrix.name }}.md
            /tmp/soak-${{ matrix.name }}.tsv
