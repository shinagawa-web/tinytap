name: docs-lint

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "site/content/**"
      - ".gomarklint.json"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "site/content/**"
      - ".gomarklint.json"

jobs:
  gomarklint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown files
        uses: shinagawa-web/gomarklint@8f054c9161d533bcdbc7d3dbf9a202cc00624d67 # v3.3.1
        with:
          args: --config .gomarklint.json
