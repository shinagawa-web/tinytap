version: 2

project_name: tinytap

# The BPF object files bpf2go emits are regenerated from bpf/*.c by
# release.yml's setup-bpf-toolchain step before this runs (#260) and
# embedded into the Go binary via //go:embed. GoReleaser itself doesn't
# need clang/libbpf — CGO_ENABLED=0 below means the actual `go build` per
# target is a normal cross-compile against the already-embedded bytes.
before:
  hooks:
    # Verify, don't mutate: `go mod tidy` followed by a diff check fails the
    # release if go.mod/go.sum aren't already tidy, instead of silently
    # rewriting them and publishing a binary that no longer matches the
    # tagged commit's source.
    - go mod tidy
    - git diff --exit-code -- go.mod go.sum

builds:
  - id: tinytap
    main: ./cmd/tinytap
    binary: tinytap
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: tinytap
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# SBOM per release artifact (syft, run by GoReleaser — see the release
# workflow's "Install syft" step for how the binary gets onto PATH).
sboms:
  - id: archive
    artifacts: archive

# Keyless signing via GitHub Actions OIDC (cosign v3's ambient credential
# detection picks up the Actions OIDC token — no key material needed). The
# bundle format combines the certificate and signature into one
# .sigstore.json file (cosign v3 dropped the old --output-certificate/
# --output-signature flags in favor of --bundle). Only checksums.txt is
# signed directly; since every archive and the SBOMs are already listed by
# digest inside checksums.txt, signing that one file transitively covers
# all of them without a signature-per-artifact fan-out.
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes # skip the interactive confirmation prompt — required for CI
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  # Adds GitHub usernames to entries. The `groups` regexes below match
  # against each commit's first line, so they only collapse cleanly into
  # one Conventional Commits-typed entry per PR if PRs are squash-merged
  # (main's merge-commit history otherwise leaves WIP sub-commits ungrouped
  # under "Other Changes" — see #231).
  use: github
  # List order controls matching precedence (first regexp match wins) —
  # independent of the `order:` field below, which only controls display
  # order. Dependencies must precede Bug Fixes/Maintenance so `fix(deps):`
  # and `chore(deps):` land there instead of the generic type group.
  groups:
    - title: "Breaking Changes"
      regexp: '^.*!:|^BREAKING CHANGE'
      order: 0
    - title: "Dependencies"
      regexp: '^(fix|chore)\(deps\):|^deps:'
      order: 3
    - title: "Features"
      regexp: "^feat"
      order: 1
    - title: "Bug Fixes"
      regexp: "^fix"
      order: 2
    - title: "Refactoring"
      regexp: "^refactor"
      order: 4
    - title: "Documentation"
      regexp: "^docs"
      order: 5
    - title: "Maintenance"
      regexp: "^chore"
      order: 6
    - title: "CI"
      regexp: "^ci"
      order: 7
    - title: "Build"
      regexp: "^build"
      order: 8
    - title: "Other Changes"
      order: 999
  filters:
    exclude:
      - "^test:"

release:
  github:
    owner: shinagawa-web
    name: tinytap
